                <summary class="title"><b>A's Child.</b></summary>
                <div class="content">
                    <p>In one of My Dreams, there's one Dream that I am really thankful to God for.</p>
                    <p>I guess I forgot how it started, but I still want to make this exist on the page.</p>
                    <p>A and the 1-year-old baby, and with someone who was 19 years old at the beginning.</p>
                    <p>The sun rising in the morning, there's someone who suddenly became a good person (someone who suddenly became motivated and determined toward achieving something). That person has a baby, let's call that person is A. A really wanted the baby to not become like the parent, like A. So, A started doing what A wanted. A raised the baby with full of love, care, and determination. Not even a single "give up" ever came to A's mind. What a serious person.</p>
                    <p>A wasn't like this before, from being lazy to becoming someone who was passionate about achieving something within themselves, because of the one thing A had: the baby A had in A's hands.</p>
                    <p>Everything A did, A could imagine what the baby would look like in the near future, it's like A could see the future of the baby would like. So A was always changing and upgrading A's plans to make things better for the baby.</p>
                    <p>While A carried this strong determination to achieve something, A took the baby outside home with confidence, bringing that positive mindset outside and socializing with people A knew, the people who used to accompany A when A was a child.</p>
                    <p>And they finally arrived at a hometown where A had once lived as a child back then. Now, A and baby, was warmly and joyfully welcomed by A's friends and the people A had met during childhood.</p>
                    <p>A realized how A had treated them so bad back then. A apologized for what A did and never visiting them, when A was invited to come. A said that A would make it up for what A had done to them, even if it couldn't be 100%. A dared to make that decision because of the second total change in A's life, caused by the baby A had.</p>
                    <p>If that baby didn't exist, A would probably have continued drowning deeper into themselves.</p>
                    <p>Then they're all went to a small mosque. The welcome from everyone there became even warmer and more full of love. They entered the mosque and sat there happily, with a small welcoming speech. Before the prayer, they prayed together, led by the mosque's caretaker, for A and A's baby.</p>
                    <p>At that moment, A was extremely thankful to God, to the baby, to A's life partner, to A's parents, to A's siblings, and to everyone who had been involved in A's life.</p>
                    <p>Once again, A was truly, deeply thankful from the bottom of A's heart.</p>
                    <p>Without the baby and A's life partner, A would have been nothing more than a miserable human living without a purpose.</p>
                  </div>

                  <p><b>Synopsis</b></p>
                  <p>Kousei Arima is a child prodigy known as the "Human Metronome" for playing the piano with precision and perfection. Guided by a strict mother and rigorous training, Kousei dominates every competition he enters, earning the admiration of his musical peers and praise from audiences. When his mother suddenly passes away, the subsequent trauma makes him unable to hear the sound of a piano, and he never takes the stage thereafter.<br><br>Nowadays, Kousei lives a quiet and unassuming life as a junior high school student alongside his friends Tsubaki Sawabe and Ryouta Watari. While struggling to get over his mother's death, he continues to cling to music. His monochrome life turns upside down the day he encounters the eccentric violinist Kaori Miyazono, who thrusts him back into the spotlight as her accompanist. Through a little lie, these two young musicians grow closer together as Kaori tries to fill Kousei's world with color.<br><br>[Written by MAL Rewrite]<br>source: <a href="https://myanimelist.net/anime/23273/Shigatsu_wa_Kimi_no_Uso">MyAnimeList</a></p>
